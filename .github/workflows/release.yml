name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill against Agent Skills spec
        run: bash .github/scripts/validate-skill.sh jp-law

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build skill zip
        run: |
          # MIT は複製物に許諾表示を含めることを求めるため、zip 内にも LICENSE を同梱する
          cp LICENSE jp-law/LICENSE
          # 展開時のトップが jp-law/ になるよう、ディレクトリごと固める
          zip -r jp-law.zip jp-law/
          unzip -l jp-law.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" jp-law.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
