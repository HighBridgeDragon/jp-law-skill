name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    uses: HighBridgeDragon/jp-skills-shared/.github/workflows/reusable-claude-review.yml@a2bb488c67b7b52a3c89f728fd346ba095534f12 # v1.0.2
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
